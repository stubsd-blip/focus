<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>מצפן ההשקעות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f3f6f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: an app shell. Side rail on desktop, bottom tab bar on phones; one view at a time, summary before detail. */
:root{
  --bg:#f3f6f4;          /* ledger paper with a green bias */
  --surface:#ffffff;
  --sunk:#e8eeea;
  --line:#d5dfd9;
  --fg:#13201b;
  --muted:#5b6b64;
  --accent:#0d6b4d;      /* growth green, primary actions */
  --accent-soft:#dcefe6;
  --accent-ink:#ffffff;
  --gold:#a8741a;        /* highlights, "important" */
  --gold-soft:#f6ecd6;
  --gain:#137a4b;
  --loss:#b4332b;
  --loss-soft:#f8e1de;
  --c1:#0d6b4d; --c2:#3a8fb7; --c3:#c08a2c; --c4:#8a6bb8; --c5:#7c8b85; --c6:#c45c4a;
  --display:"Rubik",system-ui,sans-serif;
  --body:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
  --shadow:0 1px 2px rgba(19,32,27,.06),0 4px 16px rgba(19,32,27,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1412;--surface:#151f1c;--sunk:#101917;--line:#25332f;--fg:#e6eee9;--muted:#93a49d;
  --accent:#4cc79a;--accent-soft:#173a2e;--accent-ink:#06140e;--gold:#e0b259;--gold-soft:#3a2f17;
  --gain:#5fd3a2;--loss:#f08a7e;--loss-soft:#3d1f1b;
  --c1:#4cc79a;--c2:#6bb6dc;--c3:#e0b259;--c4:#b39ae0;--c5:#8d9c96;--c6:#ec8b78;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412;--surface:#151f1c;--sunk:#101917;--line:#25332f;--fg:#e6eee9;--muted:#93a49d;
  --accent:#4cc79a;--accent-soft:#173a2e;--accent-ink:#06140e;--gold:#e0b259;--gold-soft:#3a2f17;
  --gain:#5fd3a2;--loss:#f08a7e;--loss-soft:#3d1f1b;
  --c1:#4cc79a;--c2:#6bb6dc;--c3:#e0b259;--c4:#b39ae0;--c5:#8d9c96;--c6:#ec8b78;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.65 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance;font-weight:600}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem)}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:0}
a{color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:24px 16px;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.15rem;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.rail .foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:8px}
main{min-width:0;padding-block:28px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.tabbar{display:none}

@media (max-width:860px){
  .shell{display:block}
  .rail{display:none}
  main{padding-block:16px 110px}
  .tabbar{display:flex;position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));justify-content:space-around}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);text-decoration:none;font-size:.7rem;border-radius:10px;min-width:0}
  .tabbar a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar a[aria-current="page"]{color:var(--accent);font-weight:700}
  .mtop{display:flex}
}
.mtop{display:none;align-items:center;justify-content:space-between;gap:10px;margin:0 auto 12px;max-width:980px}
.mtop .brand{padding:0}

/* building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
.lead{font-size:1.06rem;color:var(--muted);max-width:68ch}
.prose{max-width:70ch;display:flex;flex-direction:column;gap:10px}
.prose ul,.prose ol{margin:0;padding-inline-start:1.25em;display:flex;flex-direction:column;gap:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--fg);min-height:42px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--loss)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:.88rem}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--gold-soft);color:var(--gold)}
.pill.bad{background:var(--loss-soft);color:var(--loss)}

.disclaimer{display:flex;gap:12px;align-items:flex-start;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);color:var(--fg);border-radius:var(--r);padding:12px 16px;font-size:.9rem}
.disclaimer svg{flex:none;margin-top:3px;stroke:var(--gold);fill:none;stroke-width:2}
.note{border-inline-start:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:8px;font-size:.94rem}
.note.gold{border-color:var(--gold);background:var(--gold-soft)}
.note.red{border-color:var(--loss);background:var(--loss-soft)}

/* KPI tiles */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--mono);font-size:1.45rem;font-weight:500;direction:ltr;text-align:right;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.82rem}
.up{color:var(--gain)} .down{color:var(--loss)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .card.main{background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%);display:flex;flex-direction:column;gap:14px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.6rem}

/* path timeline */
.steps{display:flex;flex-direction:column;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;position:relative;padding-bottom:18px}
.step::before{content:"";position:absolute;inset-inline-start:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step .body{min-width:0}
.step details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.step summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.step summary::-webkit-details-marker{display:none}
.step summary h3{flex:1}
.step .content{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.chev{transition:transform .2s;flex:none;stroke:var(--muted);fill:none;stroke-width:2}
details[open]>summary .chev{transform:rotate(180deg)}

/* accordion (learn) */
.acc details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.acc summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary .ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:700}
.acc summary .t{flex:1;min-width:0}
.acc summary .t small{display:block;color:var(--muted);font-size:.84rem}
.acc .content{padding:0 16px 18px;display:flex;flex-direction:column;gap:12px}
.oneliner{font-weight:700;color:var(--accent)}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;color:var(--muted);font-weight:700;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:none}
td:first-child{min-width:130px}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr;text-align:left}

/* forms */
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:span 2}
.field label{font-size:.8rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px;width:100%}
.field textarea{min-height:120px;font-family:var(--mono);font-size:.8rem;direction:ltr}
input[type="range"]{accent-color:var(--accent)}

/* checklists */
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 8px;border-radius:10px;cursor:pointer}
.check:hover{background:var(--sunk)}
.check input{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex:none;margin-top:2px;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.check span small{display:block;color:var(--muted);text-decoration:none;font-size:.84rem}

/* quiz */
.q{display:flex;flex-direction:column;gap:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* allocation bars */
.alloc{display:flex;height:34px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.alloc span{display:grid;place-items:center;font-size:.78rem;font-weight:700;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.86rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}

/* charts */
.chart{width:100%;direction:ltr}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font:500 13px var(--body)}
.donutwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donutwrap .chart{width:180px;flex:none}

/* compare table option cards */
.optcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.optcard{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.optcard ul{margin:0;padding-inline-start:1.1em;font-size:.9rem;display:flex;flex-direction:column;gap:3px}
.pro{color:var(--gain)} .con{color:var(--loss)}

.glossary{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.term{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.term b{font-family:var(--display);display:block}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:min(640px,100%);max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:60;font-size:.9rem;box-shadow:var(--shadow)}
.sectionhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.demo-banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sunk);border:1px dashed var(--line);padding:10px 14px;border-radius:12px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>
<div class="shell">
  <aside class="rail" aria-label="ניווט">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="M17 6 L21 17 L17 28 L13 17 Z" fill="var(--accent)"/><circle cx="17" cy="17" r="2.4" fill="var(--surface)"/></svg>
      <div><b>מצפן ההשקעות</b><small>מדריך ויומן למשקיע המתחיל</small></div>
    </div>
    <nav class="nav" id="railnav"></nav>
    <div class="foot">כלי לימודי בלבד. אינו ייעוץ השקעות.<br><span id="syncstate">נשמר במכשיר זה</span></div>
  </aside>
  <main>
    <div class="mtop">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="M17 6 L21 17 L17 28 L13 17 Z" fill="var(--accent)"/><circle cx="17" cy="17" r="2.4" fill="var(--surface)"/></svg>
        <b>מצפן ההשקעות</b>
      </div>
      <span class="pill" id="syncstate2">נשמר במכשיר</span>
    </div>
    <div class="view" id="app"></div>
  </main>
</div>
<nav class="tabbar" id="tabbar" aria-label="ניווט"></nav>
<div id="modalroot"></div>
<script>
/* ===== Content: everything the app teaches. Numbers that change over time are marked "לבדוק". ===== */
const LEARN = [
  { id:"why", ic:"1", t:"למה להשקיע בכלל?", s:"אינפלציה, זמן, וכסף שעובד בשבילך",
    one:"כסף שיושב בעו״ש מאבד ערך כל שנה. השקעה נכונה לטווח ארוך נועדה לשמור על הערך ולהצמיח אותו.",
    body:`<p>אם האינפלציה היא 3% בשנה, 100,000 ₪ בעו״ש יקנו בעוד 10 שנים רק מה שכ-74,000 ₪ קונים היום. השקעה היא דרך לתת לכסף לגדול מהר יותר מהמחירים.</p>
    <p>אבל השקעה היא לא חיסכון בבנק: הערך עולה ויורד, לפעמים בחדות. לכן משקיעים רק כסף שלא צריך בשנים הקרובות, ורק אחרי שיש כרית ביטחון.</p>
    <div class="note">הכלל הראשון: כסף שתצטרך בתוך 3 שנים לא הולך למניות.</div>` },
  { id:"stock", ic:"2", t:"מניה", s:"חתיכה קטנה מחברה",
    one:"מניה = בעלות חלקית בחברה. מרוויחים כשהחברה גדלה (עליית מחיר) ולפעמים מדיבידנד.",
    body:`<p>כשקונים מניה של חברה, הופכים לשותף קטן בה. אם החברה מצליחה, המניה בדרך כלל עולה. אם נכשלת, המניה יכולה לרדת מאוד ואפילו להתאפס.</p>
    <p><b>למה מתחילים לא בוחרים מניות בודדות?</b> כי גם מקצוענים מתקשים לנחש איזו חברה תצליח. מניה אחת יכולה לרדת 70% ולא לחזור. הפתרון הוא לקנות הרבה חברות יחד, דרך קרן מחקה מדד (ראה בהמשך).</p>
    <p><b>דיבידנד</b> הוא חלק מהרווח שהחברה מחלקת לבעלי המניות. בישראל הוא ממוסה ב-25%.</p>` },
  { id:"bond", ic:"3", t:"אג״ח (אגרות חוב)", s:"הלוואה שאתה נותן למדינה או לחברה",
    one:"אג״ח = אתה המלווה. תנודתי פחות ממניות, ומרוויח פחות לאורך זמן. משמש לייצוב התיק.",
    body:`<p>כשקונים אג״ח, מלווים כסף למדינה (אג״ח ממשלתי) או לחברה (אג״ח קונצרני) ומקבלים ריבית. אג״ח ממשלתי של ישראל או ארה״ב נחשב בטוח יחסית.</p>

function holdings(src = data()){
  const H = {};
  const sorted = [...src.trades].sort((a,b)=>a.date.localeCompare(b.date));
  for (const t of sorted){
    const k = fundKey(t);
    const h = H[k] ||= { key:k, fund:t.fund, ticker:t.ticker, cat:t.cat, account:t.account, cur:t.cur, units:0, cost:0, realized:0, lastPrice:t.price, lastDate:t.date };
    const fx = t.cur==="USD" ? (+t.fx||1) : 1;
    const u = +t.units||0, p = +t.price||0, fee = +t.fee||0;
    if (t.type === "sell"){
      const avg = h.units ? h.cost/h.units : 0;
      const uu = Math.min(u, h.units);
      h.realized += uu*p*fx - fee - avg*uu; h.cost -= avg*uu; h.units -= uu;
    } else { h.units += u; h.cost += u*p*fx + fee; }
    h.lastPrice = p; h.lastDate = t.date; h.fund = t.fund; h.cat = t.cat; h.cur = t.cur;
  }
  for (const h of Object.values(H)){
    const pr = src.prices[h.key];
    h.price = pr ? +pr.price : h.lastPrice;
    h.priceDate = pr ? pr.date : h.lastDate;
    const fx = h.cur==="USD" ? (+src.fx?.USD||3.7) : 1;
    h.value = h.units * h.price * fx;
    h.gain = h.value - h.cost;
  }
  return Object.values(H).filter(h => h.units > 1e-9 || Math.abs(h.realized) > 0.005);
}
function totals(src = data()){
  const hs = holdings(src);
  const invested = hs.reduce((s,h)=>s+h.cost,0), value = hs.reduce((s,h)=>s+h.value,0), realized = hs.reduce((s,h)=>s+h.realized,0);
  const deposited = src.trades.filter(t=>t.type!=="sell").reduce((s,t)=>s+(+t.units)*(+t.price)*(t.cur==="USD"?+t.fx||1:1)+(+t.fee||0),0);
  const gain = value - invested;
  return { hs, invested, value, realized, gain, pct: invested? gain/invested : 0, tax: Math.max(0,gain)*0.25, deposited };
}

/* ---------- charts (hand-drawn SVG, one scale per chart) ---------- */
function donut(items, size=180){
  const total = items.reduce((s,i)=>s+i.value,0) || 1;
  const r = 70, c = 2*Math.PI*r; let off = 0;
  const segs = items.filter(i=>i.value>0).map(i => {
    const len = i.value/total*c;
    const s = `<circle cx="90" cy="90" r="${r}" fill="none" style="stroke:${i.color}" stroke-width="26" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${esc(i.label)}: ${(i.value/total*100).toFixed(1)}%</title></circle>`;
    off += len; return s;
  }).join("");
  return `<div class="chart"><svg viewBox="0 0 180 180" width="${size}" role="img" aria-label="חלוקת התיק"><circle cx="90" cy="90" r="${r}" fill="none" style="stroke:var(--sunk)" stroke-width="26"/>${segs}</svg></div>`;
}
function legend(items){
  const total = items.reduce((s,i)=>s+i.value,0) || 1;
  return `<div class="legend" style="flex-direction:column;gap:6px">${items.filter(i=>i.value>0).map(i=>`<div><i style="background:${i.color}"></i>${esc(i.label)} <b class="num">${(i.value/total*100).toFixed(0)}%</b> <span class="muted small num">${ILS.format(i.value)}</span></div>`).join("")}</div>`;
}
function niceMax(v){ if (v<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function shortILS(v){ if (Math.abs(v)>=1e6) return (v/1e6).toFixed(v%1e6?1:0)+"M"; if (Math.abs(v)>=1e4) return (v/1e3).toFixed(0)+"K"; if (Math.abs(v)>=1e3) return (v/1e3).toFixed(1).replace(/\.0$/,"")+"K"; return v.toFixed(0); }
/* series: [{name,color,points:[[x,y]],area?:bool,step?:bool,dots?:bool}] ; x numeric */
function lineChart(series, {xfmt=(x)=>x, h=240, xticks=5, minSpan=0}={}){
  const W=480, H=h, L=46, R=14, T=14, B=28;
  const xs = series.flatMap(s=>s.points.map(p=>p[0])), ys = series.flatMap(s=>s.points.map(p=>p[1]));
  if (!xs.length) return "";
  let x0=Math.min(...xs), x1=Math.max(...xs); if (x1-x0 < minSpan){ const c=(x0+x1)/2; x0=c-minSpan/2; x1=c+minSpan/2; } if (x1===x0) x1=x0+1;
  const ymax = niceMax(Math.max(...ys)*1.05);
  const X = x => L + (x-x0)/(x1-x0)*(W-L-R), Y = y => T + (1 - y/ymax)*(H-T-B);
  let g = "";
  for (let i=0;i<=4;i++){ const v=ymax*i/4, y=Y(v); g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-width="1" ${i?'stroke-dasharray="3 4"':''}/><text x="${L-8}" y="${y+4}" text-anchor="end">${shortILS(v)}</text>`; }
  for (let i=0;i<xticks;i++){ const xv = x0 + (x1-x0)*i/(xticks-1); g += `<text x="${X(xv)}" y="${H-8}" text-anchor="${i===0?'start':i===xticks-1?'end':'middle'}">${esc(xfmt(xv))}</text>`; }
  let paths = "";
  for (const s of series){
    const pts = s.points.map(p=>[X(p[0]),Y(p[1])]);
    let d = "";
    pts.forEach((p,i)=>{ if(i===0) d+=`M${p[0]},${p[1]}`; else if (s.step) d+=`H${p[0]}V${p[1]}`; else d+=`L${p[0]},${p[1]}`; });
    if (s.area && pts.length) paths += `<path d="${d}V${Y(0)}H${pts[0][0]}Z" style="fill:${s.color};opacity:.14"/>`;
    paths += `<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="2.4" stroke-linejoin="round"/>`;
    if (s.dots) paths += pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" style="fill:${s.color}"/>`).join("");
    const last = pts[pts.length-1]; if (last) paths += `<circle cx="${last[0]}" cy="${last[1]}" r="5" style="fill:var(--surface);stroke:${s.color}" stroke-width="2.4"/>`;
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}${paths}</svg></div>`;
}

function allocBar(a){
  const keys = Object.keys(ACAT).filter(k=>a[k]>0);
  return `<div class="alloc">${keys.map(k=>`<span style="width:${a[k]}%;background:${ACAT[k][1]}" title="${ACAT[k][0]}">${a[k]>=8?a[k]+"%":""}</span>`).join("")}</div>
  <div class="legend">${keys.map(k=>`<span><i style="background:${ACAT[k][1]}"></i>${ACAT[k][0]} <b class="num">${a[k]}%</b></span>`).join("")}</div>`;
}

/* ---------- PATH ---------- */
function viewPath(){
  const done = PATH.filter(p=>S.steps[p.id]).length; const nx = nextStep();
  return `
  <div class="stack"><span class="eyebrow">המסלול שלי</span><h1>מה עושים, ובאיזה סדר</h1>
  <p class="lead">${PATH.length} שלבים. כל שלב בונה על הקודם. סמן ״סיימתי״ כשהשלב מאחוריך, וההתקדמות תישמר.</p>
  <div class="bar" aria-label="התקדמות"><i style="width:${done/PATH.length*100}%"></i></div></div>
  <div class="steps">
    ${PATH.map((p,i)=>`<div class="step ${S.steps[p.id]?'done':''}">
      <div class="dot">${S.steps[p.id]?'✓':i+1}</div>
      <div class="body"><details ${nx&&nx.id===p.id?'open':''}>
        <summary><h3>${esc(p.t)}</h3><span class="small muted" style="display:none"></span>${S.steps[p.id]?'<span class="pill good">הושלם</span>':''}<svg class="chev" width="18" height="18" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></summary>
        <div class="content prose" style="max-width:none"><p class="muted small">${esc(p.s)}</p>${p.body}
          <div class="row"><button class="btn ${S.steps[p.id]?'':'primary'} sm" data-step="${p.id}">${S.steps[p.id]?'בטל סימון':'סיימתי את השלב הזה'}</button></div>
        </div></details></div></div>`).join("")}
  </div>
  <div class="card stack">
    <div class="sectionhead"><h2>שאלות שחובה לשאול</h2><span class="pill">${Object.values(S.asks).filter(Boolean).length} סומנו</span></div>
    <p class="muted small">לפני שפותחים חשבון או בוחרים קרן. סמן כל שאלה שקיבלת עליה תשובה.</p>
    <div class="grid g2">${ASKS.map(g=>`<div class="stack" style="gap:4px"><h3>${g.g}</h3><div class="checks">${g.items.map(([id,q,h])=>`<label class="check"><input type="checkbox" data-ask="${id}" ${S.asks[id]?'checked':''}><span>${esc(q)}${h?`<small>${esc(h)}</small>`:''}</span></label>`).join("")}</div></div>`).join("")}</div>
  </div>
  <div class="card stack">
    <h2>נורות אדומות</h2>
    <p class="muted small">אם אחד מאלה קורה, עצור ובדוק פעמיים.</p>
    <ul class="prose" style="margin:0">${REDFLAGS.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>
  </div>
  ${DISCLAIMER}`;
}
function afterPath(){
  const w = $("#whereCards");
  if (w) w.innerHTML = `<p>אין תשובה אחת. הנה ההבדלים העיקריים. רבים מתחילים בקופת גמל להשקעה או בברוקר ישראלי עצמאי.</p>
  <div class="optcards">${WHERE.map(o=>`<div class="optcard"><div class="row" style="justify-content:space-between"><h3>${esc(o.t)}</h3><span class="pill">${esc(o.tag)}</span></div>${o.ex?`<span class="small muted">${esc(o.ex)}</span>`:''}
    <ul>${o.pro.map(x=>`<li class="pro"><span style="color:var(--fg)">${esc(x)}</span></li>`).join("")}${o.con.map(x=>`<li class="con"><span style="color:var(--fg)">${esc(x)}</span></li>`).join("")}</ul>
    <p class="small"><b>מתאים ל:</b> ${esc(o.fit)}</p></div>`).join("")}</div>
  <p class="small muted">הדוגמאות אינן המלצה ואינן רשימה מלאה. עמלות משתנות: השווה מחירונים עדכניים באתרי הגופים עצמם. ירוק = יתרון, אדום = חיסרון.</p>`;
  $$("[data-step]").forEach(b=>b.onclick=()=>{ const id=b.dataset.step; S.steps[id]=!S.steps[id]; save(); render(); if(S.steps[id]) toast("כל הכבוד, השלב סומן"); });
  $$("[data-ask]").forEach(c=>c.onchange=()=>{ S.asks[c.dataset.ask]=c.checked; save(); });

  return `<div class="card stack" style="border-color:var(--accent)">
    <div class="sectionhead"><div><span class="eyebrow">התוצאה שלך</span><h2>${esc(r.p.name)}</h2></div><span class="pill good">ניקוד ${r.score} מתוך 32</span></div>
    <p>${esc(r.p.d)}</p>
    ${allocBar(a)}
    ${r.notes.map(n=>`<div class="note gold">${esc(n)}</div>`).join("")}
    <div class="grid g3">
      <div class="kpi"><span class="eyebrow">חלק מנייתי</span><span class="v">${stocks}%</span></div>
      <div class="kpi"><span class="eyebrow">ירידה אפשרית במשבר חמור</span><span class="v down">−${crash}%</span><span class="s muted">המחשה גסה, לא תחזית</span></div>
      <div class="kpi"><span class="eyebrow">על 100,000 ₪</span><span class="v down">−${ILS.format(crash*1000)}</span><span class="s muted">זמנית, עד התאוששות</span></div>

    <ul class="prose" style="margin:0">
      ${a.gl?`<li><b>${a.gl}% מניות חו״ל</b>: קרן מחקה מדד עולמי רחב (MSCI World / ACWI) או S&amp;P 500.</li>`:''}
      ${a.il?`<li><b>${a.il}% מניות ישראל</b>: קרן מחקה ת״א 125.</li>`:''}
      ${a.bd?`<li><b>${a.bd}% אג״ח</b>: קרן אג״ח ממשלתי או מדד אג״ח רחב.</li>`:''}
      ${a.cs?`<li><b>${a.cs}% מזומן</b>: קרן כספית או פיקדון.</li>`:''}
    </ul>
    <p class="small muted">דרך פשוטה עוד יותר: מסלול אחד בקופת גמל להשקעה או בקרן השתלמות שהחשיפה המנייתית שלו קרובה ל-${stocks}%.</p>
    <div class="row"><a class="btn primary" href="#path">חזרה למסלול</a><a class="btn" href="#calc">לראות במחשבון</a><button class="btn ghost" id="qreset">לענות מחדש</button></div>
  </div>`;
}
function afterProfile(){
  $$('.opt input').forEach(inp=>inp.onchange=()=>{
    const i = +inp.name.slice(1); S.quiz[i] = +inp.value; save();
    const r = profileResult(); const answered = Object.keys(S.quiz).length;
    $(".bar i").style.width = (answered/QUIZ.length*100)+"%";
    $("#presult").innerHTML = r ? resultCard(r) : `<div class="empty">ענה על כל השאלות כדי לראות את התוצאה (${answered}/${QUIZ.length})</div>`;
    bindReset();
    if (r && answered===QUIZ.length && i===QUIZ.length-1) $("#presult").scrollIntoView({behavior:"smooth",block:"start"});
  });
  bindReset();
}
function bindReset(){ const b=$("#qreset"); if (b) b.onclick=()=>{ S.quiz={}; save(); render(); window.scrollTo(0,0); }; }

function historySeries(src){
  const trades = [...src.trades].sort((a,b)=>a.date.localeCompare(b.date));
  if (!trades.length) return null;
  const pts = []; let inv = 0; const units = {}, costs = {};
  for (const t of trades){
    const k = fundKey(t), fx = t.cur==="USD"?+t.fx||1:1;
    units[k]=units[k]||0; costs[k]=costs[k]||0;
    if (t.type==="sell"){ const avg = units[k]?costs[k]/units[k]:0; const u=Math.min(+t.units,units[k]); costs[k]-=avg*u; units[k]-=u; }
    else { units[k]+=+t.units; costs[k]+=(+t.units)*(+t.price)*fx+(+t.fee||0); }
    inv = Object.values(costs).reduce((a,b)=>a+b,0);
    pts.push([Date.parse(t.date), inv]);
  }
  const T = totals(src);
  pts.push([Date.parse(today()), T.invested]);
  let vals;
  if (isDemo()){
    // demo: value approximated at each monthly buy from the demo price paths
    vals = []; const u = {};
    for (const t of trades){ u[t.ticker]=(u[t.ticker]||0)+ +t.units; const priceAt = {}; trades.filter(x=>x.date<=t.date).forEach(x=>priceAt[x.ticker]=+x.price); vals.push([Date.parse(t.date), Object.entries(u).reduce((s,[k,n])=>s+n*(priceAt[k]||0),0)]); }
  } else vals = (src.snapshots||[]).map(s=>[Date.parse(s.date), s.value]);
  vals.push([Date.parse(today()), T.value]);
  return { inv:pts, val:vals };
}

const CALC = { init:10000, monthly:1000, rate:6, years:20, fee:0.2, fee2:1.0, infl:2.5, real:false };
function simulate(init, monthly, rate, fee, years){
  const r = Math.pow(1 + (rate-fee)/100, 1/12) - 1; let bal = init, dep = init; const pts=[[0,bal]], dps=[[0,dep]];
  for (let m=1;m<=years*12;m++){ bal = bal*(1+r) + monthly; dep += monthly; if (m%12===0){ pts.push([m/12,bal]); dps.push([m/12,dep]); } }
  return { bal, dep, pts, dps };
}

    const gainTax = Math.max(0, a.bal - a.dep)*0.25*df(CALC.years);
    $("#calcKpis").innerHTML = `
      <div class="card kpi"><span class="eyebrow">שווי משוער בעוד ${CALC.years} שנים</span><span class="v up">${ILS.format(A)}</span><span class="s muted">${CALC.real?"בכוח קנייה של היום":"נומינלי"}</span></div>
      <div class="card kpi"><span class="eyebrow">מתוכו הפקדות שלך</span><span class="v">${ILS.format(a.dep)}</span><span class="s muted">צמיחה: ${ILS.format(A - a.dep*(CALC.real?df(CALC.years):1))}</span></div>
      <div class="card kpi"><span class="eyebrow">מס משוער במשיכה</span><span class="v">${ILS.format(gainTax)}</span><span class="s muted">25% מהרווח (בערך)</span></div>
      <div class="card kpi"><span class="eyebrow">ההפרש בגלל דמי ניהול</span><span class="v down">${ILS.format(A-B)}</span><span class="s muted">${CALC.fee}% מול ${CALC.fee2}%</span></div>`;
    $("#calcChart").innerHTML = lineChart([
      {color:"var(--c5)", points:adj(a.dps)},
      {color:"var(--c6)", points:adj(b.pts)},
      {color:"var(--c1)", points:adj(a.pts), area:true},
    ], { xfmt: x=>`${Math.round(x)} ש׳`, xticks: Math.min(6, CALC.years+1), h:250 });
    const share = A>0 ? (A-B)/A : 0;
    $("#feeLesson").innerHTML = `<h3>מה דמי הניהול עושים לך</h3><p>בתרחיש הזה, ההבדל בין ${CALC.fee}% ל-${CALC.fee2}% דמי ניהול בשנה הוא <b class="num down">${ILS.format(A-B)}</b>, כלומר כ-<b>${(share*100).toFixed(0)}%</b> מהכסף שהיה יכול להיות שלך. זו הסיבה שבודקים דמי ניהול לפני הכל.</p>`;
  };
  keys.forEach(k=>{
    const r=$("#r_"+k), n=$("#c_"+k);
    r.oninput = () => { n.value = r.value; CALC[k] = +r.value; draw(); };
    n.oninput = () => { const v = +n.value; if (isNaN(v)) return; CALC[k] = Math.max(+n.min, k==="years"?Math.min(60,Math.round(v)||1):v); r.value = CALC[k]; draw(); };
  });
  $("#c_real").onchange = e => { CALC.real = e.target.checked; draw(); };
  $$("[data-sc]").forEach(b=>b.onclick=()=>{ CALC.rate=+b.dataset.sc; $("#r_rate").value=CALC.rate; $("#c_rate").value=CALC.rate; draw(); });
  draw();
}

/* ---------- MONTHLY ---------- */
let monthOffset = 0;
function monthItems(d){ return [...MONTHLY, ...(SEASONAL[d.getMonth()+1]||[])]; }
function viewMonthly(){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+monthOffset);
  const mk = monthKey(new Date(d.getFullYear(), d.getMonth(), 15)); const items = monthItems(d); const st = S.monthly[mk]||{};
  const done = items.filter(i=>st[i[0]]).length;
  const hist = Object.keys(S.monthly).sort().reverse().slice(0,12).map(k=>{ const dd=new Date(k+"-15"); const it=monthItems(dd); const n=it.filter(i=>S.monthly[k][i[0]]).length; return {k,dd,n,t:it.length}; });
  return `<div class="stack"><span class="eyebrow">משימות חודשיות</span><h1>מה עושים החודש</h1>
  <p class="lead">השגרה של משקיע לטווח ארוך קצרה ומשעממת, וזה בדיוק הרעיון. כמה דקות בחודש, וסקירה מסודרת פעם בשנה.</p></div>
  <div class="card stack">
    <div class="sectionhead"><div class="row"><button class="btn sm" id="mPrev" aria-label="חודש קודם">→</button><h2>${HEB_MONTHS[d.getMonth()]} ${d.getFullYear()}</h2><button class="btn sm" id="mNext" aria-label="חודש הבא" ${monthOffset>=1?'disabled':''}>←</button></div><span class="pill ${done===items.length?'good':''}">${done}/${items.length} הושלמו</span></div>
    <div class="bar"><i style="width:${done/items.length*100}%"></i></div>
    <div class="checks">${items.map(([id,t,h])=>`<label class="check"><input type="checkbox" data-m="${id}" ${st[id]?'checked':''}><span>${esc(t)}${SEASONAL[d.getMonth()+1]?.some(x=>x[0]===id)?' <span class="pill warn">עונתי</span>':''}${h?`<small>${esc(h)}</small>`:''}</span></label>`).join("")}</div>
  </div>
  <div class="grid g2">
    <div class="card stack"><h2>לוח השנה של המשקיע</h2>
      <div class="tablewrap"><table><tbody>
        <tr><td><b>ינואר</b></td><td>טופס 867, סקירה שנתית</td></tr>
        <tr><td><b>מרץ</b></td><td>הכנת דוח שנתי (אם יש ברוקר זר)</td></tr>
        <tr><td><b>יוני</b></td><td>בדיקת אמצע שנה</td></tr>
        <tr><td><b>אוקטובר</b></td><td>בדיקת דמי ניהול בקופות</td></tr>
        <tr><td><b>דצמבר</b></td><td>איזון שנתי, קיזוז הפסדים</td></tr>
      </tbody></table></div></div>
    <div class="card stack"><h2>ההיסטוריה שלך</h2>
      ${hist.length?`<div class="checks">${hist.map(h=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${HEB_MONTHS[h.dd.getMonth()]} ${h.dd.getFullYear()}</span><span class="pill ${h.n===h.t?'good':h.n?'warn':''}">${h.n}/${h.t}</span></div>`).join("")}</div>`:`<div class="empty">החודשים שתסמן יופיעו כאן</div>`}
    </div>
  </div>
  <div class="card stack"><h2>עדכונים והמלצות חדשות</h2>
    <p>האפליקציה עצמה לא מושכת מידע מהאינטרנט ולא ״ממליצה״ באופן אוטומטי. בשביל משקיע מתחיל לטווח ארוך, זה יתרון: התוכנית לא אמורה להשתנות בגלל חדשות. אם תרצה בכל זאת עדכון קבוע, אפשר לבקש ממני להגדיר סקירה חודשית אוטומטית שתעבור על השינויים בעמלות ובכללי המס ותזכיר לך מה לבדוק.</p>
  </div>`;
}
document.addEventListener("click", e=>{
  if (e.target.id==="mPrev"){ monthOffset--; render(); }
  if (e.target.id==="mNext" && monthOffset<1){ monthOffset++; render(); }
});
document.addEventListener("change", e=>{
  const id = e.target.dataset?.m; if (!id) return;
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+monthOffset);
  const mk = monthKey(new Date(d.getFullYear(), d.getMonth(), 15));
  (S.monthly[mk] ||= {})[id] = e.target.checked; save();
  const items = monthItems(d), n = items.filter(i=>S.monthly[mk][i[0]]).length;
  const pill = $(".sectionhead .pill"); if (pill){ pill.textContent = `${n}/${items.length} הושלמו`; pill.classList.toggle("good", n===items.length); }
  const bar = $(".bar i"); if (bar) bar.style.width = (n/items.length*100)+"%";
});

/* ---------- boot ---------- */
buildNav(); render(); connectDb();
</script></body></html>
